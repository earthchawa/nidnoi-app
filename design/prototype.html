let voiceWarned = false;
function say(text, slow) {
  try {
    const ss = window.speechSynthesis;
    if (!ss) { toast('Audio isn’t available in this browser'); return; }
    ss.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'th-TH';
    u.rate = slow ? 0.55 : (S.settings.slow ? 0.7 : 0.9);
    const v = ss.getVoices().find(v => /^th/i.test(v.lang));
    if (v) u.voice = v;
    else if (!voiceWarned) { voiceWarned = true; toast('No Thai voice on this device, so audio may sound off'); }
    ss.speak(u);
  } catch (e) { toast('Audio isn’t available here'); }
}

  return { id, type, retry: !!retry, opts: shuffle([id, ...pool]) };

        <button class="mini-say" data-act="say" data-id="${w.id}" aria-label="Play the word">${ic.speaker}</button></div>
        ${R.practice ? `<button class="btn btn-primary btn-block" data-act="rate" data-r="none">Continue</button>`
        : `<div class="rate">
            <button class="btn btn-ghost" data-act="rate" data-r="hard">Hard<small>tomorrow</small></button>
            <button class="btn btn-primary" data-act="rate" data-r="good">Good<small>in 3 days</small></button>
            <button class="btn btn-ghost" data-act="rate" data-r="easy">Easy<small>in a week</small></button></div>`}</div>`
      : `<div class="fb no"><div class="fb-head">${noi('oops', 54)}<div><p class="fb-title">Not quite</p>${line}</div>
        <button class="mini-say" data-act="say" data-id="${w.id}" aria-label="Play the word">${ic.speaker}</button></div>
        <button class="btn btn-ghost btn-block" data-act="again">Continue · you’ll see it again</button></div>`;
  }
  return top + `<section class="card" style="gap:10px;padding-block:22px">${prompt}</section><div class="opts">${opts}</div>${fb}`;
}

/* ---------- Library ---------- */
function viewLibrary() {
  const learned = ALL.filter(w => status(w.id) !== 'new').length;
  const f = (k, l) => `<button class="fchip" data-act="filter" data-f="${k}" aria-pressed="${lib.f === k}">${l}</button>`;
  return `<header><div class="eyebrow">${learned} words learned across ${LESSONS.length} lessons</div><h1>Library</h1></header>
    <label class="search">${ic.search}<input id="lib-search" type="search" placeholder="Search Thai, sounds or English" value="${esc(lib.q)}" autocomplete="off"></label>
    <div class="filters">${f('all', 'All')}${f('saved', 'Saved')}${f('weak', 'Weak')}${f('known', 'Known')}</div>
    <div id="lib-list" class="stack" style="gap:18px">${libList()}</div>`;
}
function libList() {
  const q = fold(lib.q.trim());
  const keep = w => {
    if (lib.f === 'saved' && !S.saved.includes(w.id)) return false;
    if (lib.f === 'weak' && status(w.id) !== 'weak') return false;
    if (lib.f === 'known' && status(w.id) !== 'known') return false;
    return !q || w.th.includes(lib.q.trim()) || fold(w.ph).includes(q) || fold(w.en).includes(q);
  };
  const groups = LESSONS.map(L => {
    const words = L.words.map(w => ({...w, lesson:L})).filter(keep);
    if (!words.length) return '';
    const when = L.date === TODAY ? 'Today' : L.date === addDays(TODAY, -1) ? 'Yesterday' : fmt(L.date);
    return `<section class="group"><h2 class="group-h"><span>${when} · ${L.theme}</span><span>${words.length} ${words.length === 1 ? 'word' : 'words'}</span></h2>
      <div class="list">${words.map(item).join('')}</div></section>`;
  }).join('');
  if (groups) return groups;
  const msg = lib.q.trim() ? `No words match “${esc(lib.q.trim())}”.`
    : lib.f === 'saved' ? 'Tap the bookmark on any word to keep it here.'
    : lib.f === 'weak' ? 'No weak words right now. Nice work.' : 'Finish a review to move words to known.';
  return `<div class="empty">${noi('think', 90)}<p>${msg}</p></div>`;
}
function item(w) {
  const st = status(w.id), open = lib.open === w.id, sv = S.saved.includes(w.id);
  return `<div class="item"><button class="item-row" data-act="open" data-id="${w.id}" aria-expanded="${open}">
      <div class="item-mid"><div class="item-th" lang="th">${w.th}</div><div class="item-en">${S.settings.phon ? `<em>${w.ph}</em> · ` : ''}${w.en}</div></div>
      ${sv ? `<span class="saved-dot" aria-label="Saved">${ic.bookmark}</span>` : ''}
      <span class="st st-${st}">${st}</span></button>
    ${open ? `<div class="item-detail"><div class="tones">${toneChips(w)}</div>${exampleBlock(w)}
      <div class="actions" style="grid-template-columns:1fr auto">
        <button class="btn btn-soft" data-act="say" data-id="${w.id}">${ic.speaker}Listen</button>
        <button class="btn btn-ghost icon-btn" data-act="save" data-id="${w.id}" aria-pressed="${sv}" aria-label="Save word">${ic.bookmark}</button>
      </div></div>` : ''}</div>`;
}

/* ---------- Me ---------- */
function viewMe() {
  const learned = ALL.filter(w => status(w.id) !== 'new').length;
  const known = ALL.filter(w => status(w.id) === 'known').length;
  const start = new Date(2026, 9, 5);
  let cells = ['M','T','W','T','F','S','S'].map(d => `<span class="dl">${d}</span>`).join('');
  for (let i = 0; i < 35; i++) {
    const d = new Date(start); d.setDate(d.getDate() + i);
    const s = iso(d);
    let cls = '';
    if (s > TODAY) cls = 'fut';
    else if (s === TODAY) cls = (done() ? 'l3 ' : '') + 'now';
    else if (ACTIVE.has(s)) cls = 'l' + (1 + (d.getDate() * 7) % 3);
    cells += `<span class="hc ${cls}" title="${fmt(s)}"></span>`;
  }
  const seg = (act, val, cur, l) => `<button data-act="${act}" data-v="${val}" aria-pressed="${cur === val}">${l}</button>`;
  return `<header class="profile"><div class="av">${noi('happy', 70)}</div>
      <div><div class="eyebrow">Learning Thai with Noi</div><h1>Your progress</h1></div></header>
    <div class="stats">
      <div class="stat"><b>${streak()}</b><span>day streak</span></div>
      <div class="stat"><b>${learned}</b><span>words learned</span></div>
      <div class="stat"><b>${known}</b><span>words known</span></div>
    </div>
    <section class="panel"><div class="row-between"><h2 class="panel-h" style="margin:0">Last 5 weeks</h2>
      <div class="legend">less<span class="hc"></span><span class="hc l1"></span><span class="hc l2"></span><span class="hc l3"></span>more</div></div>
      <div class="heat">${cells}</div></section>
    <section class="set">
      <div class="set-row"><div><p class="set-t">Show sounds</p><p class="set-s">Turn off to practice reading Thai script</p></div>
        <button class="switch" role="switch" aria-checked="${S.settings.phon}" data-act="phon" aria-label="Show sounds"></button></div>
      <div class="set-row"><div><p class="set-t">I speak as</p><p class="set-s">Sets the polite ending in examples</p></div>
        <div class="segctl">${seg('voice', 'm', S.settings.voice, 'ครับ khráp')}${seg('voice', 'f', S.settings.voice, 'ค่ะ khâ')}</div></div>
      <div class="set-row"><div><p class="set-t">Listening speed</p></div>
        <div class="segctl">${seg('speed', 'n', S.settings.slow ? 's' : 'n', 'Normal')}${seg('speed', 's', S.settings.slow ? 's' : 'n', 'Slow')}</div></div>
      <div class="set-row"><div><p class="set-t">Daily reminder</p><p class="set-s">07:30 every morning</p></div><span class="soon">Soon</span></div>
    </section>
    <p class="note">Prototype with sample lessons from 1 to 3 Nov. Progress is saved in this browser only.</p>
    <div style="text-align:center"><button class="link-btn" data-act="reset" id="reset-btn">Reset prototype</button></div>`;
}

/* ---------- Shell ---------- */
const TABS = [['today', 'Today', ic.sun], ['review', 'Review', ic.cards], ['library', 'Library', ic.books], ['me', 'Me', ic.me]];
function render() {
  const app = document.getElementById('app');
  app.innerHTML = { today:viewToday, review:viewReview, library:viewLibrary, me:viewMe }[tab]();
  const n = dueIds().length;
  document.getElementById('tabs').innerHTML = TABS.map(([k, l, i]) =>
    `<button class="tab" data-act="tab" data-tab="${k}" ${k === tab ? 'aria-current="page"' : ''}>${i}${l}${k === 'review' && n ? `<span class="badge" aria-label="${n} due">${n}</span>` : ''}</button>`).join('');
  if (tab === 'library') {
    const inp = document.getElementById('lib-search');
    inp.addEventListener('input', () => { lib.q = inp.value; lib.open = null; document.getElementById('lib-list').innerHTML = libList(); });
  }
}
function go(t) { tab = t; try { history.replaceState(null, '', '#' + t); } catch (e) {} render(); window.scrollTo(0, 0); }

let resetArmed = 0;
const act = {
  tab: b => go(b.dataset.tab),
  say: b => say(BY[b.dataset.id].th),
  slow: b => say(BY[b.dataset.id].th, true),
  sayex: b => say(particle(BY[b.dataset.id].ex.th)),
  save: b => {
    const id = b.dataset.id, i = S.saved.indexOf(id);
    if (i < 0) { S.saved.push(id); toast('Saved to your library'); } else { S.saved.splice(i, 1); toast('Removed from saved'); }
    save(); render();
  },
  goto: b => { S.idx = +b.dataset.i; save(); render(); },
  prev: () => { S.idx = (S.idx + TOD.words.length - 1) % TOD.words.length; save(); render(); },
  got: () => {
    const w = TOD.words[S.idx];
    if (S.browse) {
      if (S.idx === TOD.words.length - 1) { S.browse = false; S.idx = 0; } else S.idx++;
      save(); render(); window.scrollTo(0, 0); return;
    }
    if (!S.learned.includes(w.id)) S.learned.push(w.id);
    if (done()) {
      TOD.words.forEach(x => { if (!S.srs[x.id]) S.srs[x.id] = { s:'learning', due:addDays(TODAY, 1) }; });
      S.idx = 0;
    } else {
      for (let k = 1; k <= TOD.words.length; k++) {
        const j = (S.idx + k) % TOD.words.length;
        if (!S.learned.includes(TOD.words[j].id)) { S.idx = j; break; }
      }
    }
    save(); render(); window.scrollTo(0, 0);
  },
  browse: () => { S.browse = true; S.idx = 0; save(); render(); window.scrollTo(0, 0); },
  startReview: () => startReview(false),
  practice: () => startReview(true),
  quit: () => { R = null; render(); },
  ans: b => {
    const q = R.q[R.i]; R.ans = b.dataset.id;
    const ok = R.ans === q.id;
    if (ok) { if (!q.retry) R.right++; say(BY[q.id].th); }
    render();
  },
  again: () => {
    const q = R.q[R.i];
    if (!R.practice) S.srs[q.id] = { s:'weak', due:TODAY };
    R.q.push(makeQ(q.id, (q.type + 1) % 3, true));
    next();
  },
  rate: b => {
    const q = R.q[R.i], r = b.dataset.r;
    if (!R.practice && r !== 'none') {
      const cur = status(q.id);
      let s, days;
      if (r === 'hard') { s = cur === 'weak' ? 'weak' : 'learning'; days = 1; }
      else if (r === 'good') { s = (cur === 'learning' || cur === 'known') && !q.retry ? 'known' : 'learning'; days = 3; }
      else { s = 'known'; days = 7; }
      S.srs[q.id] = { s, due:addDays(TODAY, days) };
    }
    next();
  },
  weak: () => { lib.f = 'weak'; lib.q = ''; R = null; go('library'); },
  filter: b => { lib.f = b.dataset.f; lib.open = null; render(); },
  open: b => { lib.open = lib.open === b.dataset.id ? null : b.dataset.id; render(); },
  phon: () => { S.settings.phon = !S.settings.phon; save(); render(); },
  voice: b => { S.settings.voice = b.dataset.v; save(); render(); },
  speed: b => { S.settings.slow = b.dataset.v === 's'; save(); render(); },
  reset: b => {
    if (Date.now() - resetArmed < 3000) {
      S = fresh(); R = null; lib.f = 'all'; lib.q = ''; save(); go('today'); toast('Prototype reset'); return;
    }
    resetArmed = Date.now(); b.textContent = 'Tap again to reset everything';
    setTimeout(() => { const e = document.getElementById('reset-btn'); if (e) e.textContent = 'Reset prototype'; }, 3000);
  }
};
function next() {
  save();
  R.i++; R.ans = null;
  if (R.i >= R.q.length) R.done = true;
  render(); window.scrollTo(0, 0);
  autoListen();
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (b && act[b.dataset.act]) act[b.dataset.act](b);
});
render();
</script>
