<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#58CC02" />
  <title>Nidnoi - Daily Thai Micro-Learning</title>
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Nunito', 'Kanit', 'sans-serif'],
            thai: ['Kanit', 'sans-serif'],
          },
          colors: {
            duo: {
              green: '#58CC02',
              greenDark: '#58A700',
              blue: '#1CB0F6',
              blueDark: '#1899D6',
              yellow: '#FFC800',
              yellowDark: '#E5B400',
              red: '#FF4B4B',
              redDark: '#EA2B2B',
              purple: '#CE82FF',
              purpleDark: '#A560E8',
            }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Custom Styles -->
  <link rel="stylesheet" href="./css/styles.css" />

  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body class="flex justify-center min-h-screen bg-slate-100">

  <div class="w-full max-w-md bg-white min-h-screen flex flex-col justify-between shadow-2xl relative overflow-hidden">
    
    <!-- Top Header -->
    <header class="px-5 pt-5 pb-3 border-b-2 border-gray-100 bg-white sticky top-0 z-20">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2.5">
          <div class="w-10 h-10 rounded-xl bg-duo-green flex items-center justify-center text-white text-2xl shadow-sm">
            🐘
          </div>
          <div>
            <h1 class="font-black text-xl tracking-tight text-gray-800 leading-none">
              Nidnoi <span class="text-sm font-thai font-medium text-duo-green">นิดหน่อย</span>
            </h1>
            <p id="daily-theme" class="text-xs text-gray-400 font-bold mt-0.5">Loading today's lesson...</p>
          </div>
        </div>
        
        <!-- Progress & Streak Badges -->
        <div class="flex items-center gap-2">
          <div class="flex items-center gap-1 bg-orange-50 text-orange-500 px-2.5 py-1.5 rounded-full text-xs font-extrabold border border-orange-200" title="Daily Streak">
            <span>🔥</span> <span id="streak-count">0</span>
          </div>
          <div class="flex items-center gap-1.5 bg-green-50 text-duo-greenDark px-3 py-1.5 rounded-full text-xs font-extrabold border border-green-200">
            <span>🌱</span> <span id="learned-count">0/0</span>
          </div>
        </div>
      </div>

      <!-- Overall Progress Bar -->
      <div class="w-full bg-gray-200 h-3 rounded-full mt-4 overflow-hidden">
        <div id="main-progress-bar" class="bg-duo-green h-full rounded-full transition-all duration-500 ease-out" style="width: 0%"></div>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-y-auto px-5 py-6 pb-28">
      
      <!-- VIEW 1: DAILY WORDS -->
      <section id="view-learn" class="space-y-5">
        <div id="word-pills" class="flex justify-center gap-2"></div>

        <div class="card-3d rounded-3xl p-6 relative transition-all duration-300">
          <div class="flex justify-between items-center mb-4">
            <span id="word-category" class="text-xs font-extrabold uppercase tracking-wider px-3 py-1 rounded-full bg-sky-100 text-duo-blueDark">
              Category
            </span>
            <span id="word-status-badge" class="text-xs font-extrabold px-3 py-1 rounded-full bg-gray-100 text-gray-400">
              Status
            </span>
          </div>

          <div class="text-center my-6">
            <div id="word-emoji" class="text-6xl mb-4">✨</div>
            <h2 id="word-thai" class="font-thai text-4xl font-bold text-gray-800 tracking-wide mb-2">...</h2>
            <p id="word-phonetic" class="text-lg font-extrabold text-duo-blue tracking-wide">...</p>
            <p id="word-english" class="text-2xl font-black text-gray-700 mt-2">...</p>
          </div>

          <div class="flex justify-center my-5">
            <button id="btn-speak-word" class="btn-3d-blue text-white font-extrabold px-6 py-3.5 rounded-2xl flex items-center gap-3 text-base w-full justify-center">
              <span>🔊 Listen in Thai</span>
            </button>
          </div>

          <div class="bg-amber-50 border-2 border-amber-200 rounded-2xl p-4 mt-6">
            <div class="flex items-center justify-between mb-1">
              <span class="text-xs font-black uppercase tracking-wider text-amber-600">Example Sentence</span>
              <button id="btn-speak-ex" class="text-amber-600 hover:text-amber-700 bg-amber-100 px-2.5 py-1 rounded-xl active:scale-95 transition text-xs font-bold">
                🔊 Play
              </button>
            </div>
            <p id="word-ex-thai" class="font-thai text-lg font-semibold text-gray-800">...</p>
            <p id="word-ex-phonetic" class="text-sm font-bold text-amber-700">...</p>
            <p id="word-ex-english" class="text-sm font-semibold text-gray-600 mt-1">...</p>
          </div>

          <div class="mt-4 text-center">
            <p id="word-note" class="text-xs text-gray-400 font-bold italic"></p>
          </div>
        </div>

        <!-- Controls -->
        <div class="flex items-center gap-3 pt-2">
          <button id="btn-prev" class="btn-3d-white text-gray-600 font-extrabold p-4 rounded-2xl flex items-center justify-center">◀</button>
          <button id="btn-mark-learned" class="flex-1 btn-3d-green text-white font-extrabold py-4 px-6 rounded-2xl text-lg flex items-center justify-center gap-2">
            <span>Mark as Learned</span>
          </button>
          <button id="btn-next" class="btn-3d-white text-gray-600 font-extrabold p-4 rounded-2xl flex items-center justify-center">▶</button>
        </div>
      </section>

      <!-- VIEW 2: QUICK QUIZ -->
      <section id="view-quiz" class="hidden space-y-5">
        <div id="quiz-active-box" class="space-y-5">
          <div class="flex items-center justify-between">
            <span class="text-xs font-extrabold uppercase tracking-wider text-duo-purpleDark bg-purple-100 px-3 py-1 rounded-full">
              Daily Quick Quiz
            </span>
            <span id="quiz-step-text" class="text-sm font-black text-gray-500">Question 1 of 5</span>
          </div>

          <div class="card-3d rounded-3xl p-6 text-center">
            <p class="text-xs font-bold text-gray-400 uppercase mb-2">What does this mean?</p>
            <div id="quiz-emoji" class="text-5xl mb-3">🤔</div>
            <h3 id="quiz-thai" class="font-thai text-3xl font-bold text-gray-800 mb-1">...</h3>
            <p id="quiz-phonetic" class="text-base font-extrabold text-duo-blue mb-4">...</p>
            <button id="btn-speak-quiz" class="inline-flex items-center gap-2 bg-sky-50 text-duo-blueDark border border-sky-200 px-4 py-2 rounded-xl text-xs font-extrabold active:scale-95 transition">
              🔊 Tap to hear pronunciation
            </button>
          </div>

          <div id="quiz-options" class="space-y-3"></div>

          <div id="quiz-feedback" class="hidden rounded-2xl p-4 border-2 transition-all">
            <div class="flex items-center justify-between">
              <div>
                <p id="quiz-feedback-title" class="font-black text-lg"></p>
                <p id="quiz-feedback-sub" class="text-xs font-bold"></p>
              </div>
              <button id="btn-quiz-continue" class="px-5 py-2.5 rounded-xl font-extrabold text-white text-sm shadow-md">
                Continue
              </button>
            </div>
          </div>
        </div>

        <!-- Quiz Completed Box -->
        <div id="quiz-result-box" class="hidden card-3d rounded-3xl p-8 text-center space-y-5">
          <div id="result-emoji" class="text-7xl">🎉</div>
          <h2 id="result-title" class="text-3xl font-black text-gray-800">Awesome Job!</h2>
          <p id="result-subtitle" class="text-gray-500 font-bold text-sm">You're building a great Thai habit!</p>
          
          <div class="bg-green-50 border-2 border-green-200 rounded-2xl p-5">
            <p class="text-xs uppercase font-extrabold text-duo-greenDark">Your Score</p>
            <p id="result-score" class="text-4xl font-black text-duo-green mt-1">5 / 5</p>
          </div>

          <div class="space-y-3 pt-2">
            <button id="btn-quiz-retry" class="w-full btn-3d-yellow text-gray-900 font-extrabold py-4 rounded-2xl text-base">
              🔄 Practice Again
            </button>
            <button id="btn-back-learn" class="w-full btn-3d-white text-gray-600 font-extrabold py-3.5 rounded-2xl text-sm">
              📖 Back to Flashcards
            </button>
          </div>
        </div>
      </section>

    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="bg-white border-t-2 border-gray-200 px-6 py-3 flex justify-around items-center fixed bottom-0 w-full max-w-md z-30">
      <button id="nav-learn" class="flex flex-col items-center gap-1 w-1/2 py-1 rounded-2xl transition text-duo-green">
        <span class="text-2xl">📚</span>
        <span class="text-xs font-black tracking-wide">Daily Words</span>
      </button>
      <button id="nav-quiz" class="flex flex-col items-center gap-1 w-1/2 py-1 rounded-2xl transition text-gray-400 relative">
        <span class="text-2xl">🎯</span>
        <span class="text-xs font-black tracking-wide">Quick Quiz</span>
        <span id="nav-quiz-dot" class="w-2.5 h-2.5 bg-duo-yellow rounded-full absolute top-1 right-12 animate-ping"></span>
      </button>
    </nav>

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-20 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-4 py-2 rounded-full text-xs font-bold shadow-lg opacity-0 pointer-events-none transition-opacity duration-300 z-50">
      Saved!
    </div>

  </div>

  <!-- Main App Logic -->
  <script src="./js/app.js"></script>
</body>
</html>
