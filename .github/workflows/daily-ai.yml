name: Daily Thai Lesson Generator (Agentic AI)

on:
  schedule:
    - cron: '0 0 * * *' # 07:00 ICT
  workflow_dispatch:
    inputs:
      force:
        description: Regenerate today's lesson even if it already exists
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-lesson
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Generate today's lesson
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_FALLBACK_MODELS: ${{ vars.GEMINI_FALLBACK_MODELS }}
        run: node scripts/generate-daily.ts ${{ inputs.force && '--force' || '' }}

      - name: Validate lesson data
        run: npm run check:data

      - name: Commit and push
        run: |
          git add public/data
          if git diff --cached --quiet; then
            echo "No new lesson to commit."
            exit 0
          fi
          git config user.name "nidnoi-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "content: daily lesson $(TZ=Asia/Bangkok date +%F)"
          git push
